[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vixharvest"
version = "0.1.0"
description = "VIX term-structure contango harvest strategy: ETL, curve construction, signal research, backtesting, and alerting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "requests>=2.31",
    "yfinance>=1.5",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vixharvest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
